[project]
name = "beta-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dateutil>=2.9.0.post0",
    "statsmodels>=0.15.0",
    "typer>=0.27.2",
    "plotly>=7.0.0",
    "streamlit>=1.63.0",
    "scipy>=1.18.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beta_tool"]


[project.scripts]
beta-tool = "beta_tool.cli:app"
