# beta_tool — app theme
#
# Streamlit natively supports switchable light/dark themes (Settings -> Theme,
# or "Use system setting"). [theme] holds settings that apply everywhere;
# [theme.light] / [theme.dark] override colors per mode; [theme.*.sidebar]
# overrides the sidebar specifically. Palette mirrors
# src/beta_tool/webapp/theme.py — keep the two in sync if you retune colors.
#
# Fonts load straight from Google Fonts via the "Name:<css-url>" syntax, so
# nothing needs to be vendored. Restart `streamlit run` after retuning fonts
# or `base` (the one thing that doesn't hot-reload).

[theme]
base = "dark"
font = "monospace"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap, monospace"

baseFontSize = 16
headingFontWeights = [600, 600, 550, 550, 500, 500]
metricValueFontWeight = 600

baseRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

primaryColor = "#C77D0A"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#12161C"
borderColor = "#D7DCE3"
font = "monospace"

greenColor = "#15803D"
redColor = "#B91C1C"

chartCategoricalColors = [
    "#C77D0A", # navy
    "#0F766E", # clay
    "#15803D", # positive
    "#B91C1C", # negative
    "#5B6472", # muted
    "#12161C", # ink
]



[theme.light.sidebar]
backgroundColor = "#FFFFFF"
borderColor = "#D7DCE3"
primaryColor = "#C77D0A"
textColor = "#12161C"


[theme.dark]
primaryColor = "#FFB020"
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#15181D"
textColor = "#E8EAED"
borderColor = "#262B33"
font = "monospace"

greenColor = "#22C55E"
redColor = "#EF4444"

chartCategoricalColors = [
    "#2DD4BF", # clay
    "#22C55E", # positive
    "#EF4444", # negative
    "#8A93A3", # muted
    "#FFB020", # navy
]

[theme.dark.sidebar]
backgroundColor = "#15181D"
borderColor = "#262B33"
primaryColor = "#FFB020"
textColor = "#E8EAED"